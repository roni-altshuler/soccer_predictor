# Manual team-name overrides.
#
# Each entry binds a canonical name (the spelling stored in `teams.canonical_name`)
# to one or more known aliases observed across ESPN / football-data.co.uk /
# ClubElo / OpenFootball / FBref / Understat. The team resolver consults this
# file before fuzzy matching, so this is where you resolve ambiguity (e.g.
# "Athletic" -> Athletic Bilbao, not Atletico Madrid).
#
# Keys:
#   canonical: human-readable canonical name (any spelling you prefer)
#   gender:    'M' or 'F'
#   country:   ISO 3166-1 alpha-2 (optional but useful)
#   aliases:   list of strings exactly as sources spell them
#
# Entries are read into memory by every TeamResolver and consulted BEFORE
# the fuzzy pass, so a pinned spelling always wins. Nothing here creates a
# `teams` row on its own — a team is materialised only when a real match
# resolves to it, which is what stopped this file leaving one zero-match
# orphan row per pinned club.
#
# Adding an entry only affects matches ingested afterwards. To fold an
# already-split club together in an existing warehouse, add it to
# SPLIT_IDENTITIES in `backend/scripts/repair_warehouse.py` as well, then
# re-run that script.
#
# `backend/scripts/validate_warehouse_integrity.py` fails the build if two
# teams in one competition look like the same club, which is how a missing
# entry here gets noticed.

