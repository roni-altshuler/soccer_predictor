  # =====================================================================
  # football-data.co.uk spellings (added 2026-08-08)
  #
  # football-data.co.uk uses terse, ASCII-only club names ("Swansea",
  # "Ath Madrid", "Sp Lisbon") that the fuzzy resolver scores well BELOW
  # its 0.92 auto-merge threshold against the ESPN spelling. Every miss
  # created a SECOND teams row, and because the FD loader looks for an
  # existing fixture by (competition, home_team_id, away_team_id) it then
  # failed to find the ESPN row and inserted a duplicate match. That is
  # the root cause of both the inflated per-season team counts and the
  # duplicate fixtures. These pins close it at ingest.
  #
  # Verified against the FD-only / ESPN-only split in the 2026-08-08
  # warehouse: every entry below had one FD-only id and one ESPN-only id
  # for the same club in the same competition.
  # =====================================================================

