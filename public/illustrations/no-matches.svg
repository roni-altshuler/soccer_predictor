<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="nm-pitch" x1="40" y1="120" x2="200" y2="200">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- empty stadium / pitch outline -->
  <ellipse cx="120" cy="160" rx="92" ry="40" fill="url(#nm-pitch)"/>
  <ellipse cx="120" cy="160" rx="92" ry="40" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="28" y1="160" x2="212" y2="160" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="2 4"/>
  <circle cx="120" cy="160" r="14" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.2"/>
  <!-- floating calendar/empty card -->
  <g transform="translate(78 50)">
    <rect width="84" height="76" rx="14" fill="#111e36" stroke="#243954" stroke-width="1.4"/>
    <rect x="0" y="0" width="84" height="20" rx="14" fill="#22c55e" fill-opacity="0.18"/>
    <circle cx="18" cy="10" r="2.5" fill="#22c55e"/>
    <circle cx="28" cy="10" r="2.5" fill="#22d3ee"/>
    <line x1="14" y1="34" x2="70" y2="34" stroke="#243954" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="46" x2="56" y2="46" stroke="#243954" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="58" x2="62" y2="58" stroke="#243954" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- soft glow -->
  <circle cx="120" cy="160" r="2.5" fill="#22d3ee"/>
</svg>
