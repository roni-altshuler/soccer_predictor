<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Pitchverse">
  <title>Pitchverse</title>
  <defs>
    <linearGradient id="pw-mask-grad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed gradient so the platform mask (circle / squircle / rounded
       square) never clips a transparent corner. The glyph sits inside the
       maskable safe zone (central ~80%). -->
  <rect width="512" height="512" fill="url(#pw-mask-grad)"/>

  <!-- Stylized 'P' glyph + prediction arc + target dot (48-grid art scaled
       and centered to the maskable safe area). -->
  <g transform="translate(-18.5 16) scale(10)" stroke="#02180c" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14 13.5v21M14 13.5h12M14 23.5h12" stroke-width="3.6"/>
    <path d="M26 13.5a5 5 0 0 1 0 10" stroke-width="3.6"/>
    <path d="M30.5 31.5c0-4.4 3.6-8 8-8" stroke-width="3.2" opacity="0.55"/>
    <circle cx="38.5" cy="23.5" r="2.4" fill="#02180c" stroke="none"/>
  </g>
</svg>
