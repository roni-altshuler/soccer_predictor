<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.5" stop-color="#0c182a"/>
      <stop offset="1" stop-color="#111e36"/>
    </linearGradient>
    <radialGradient id="glowL" cx="120" cy="80" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="1080" cy="120" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <!-- grid texture -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.35">
    <path d="M0 100 L1200 100 M0 250 L1200 250 M0 400 L1200 400 M0 550 L1200 550"/>
    <path d="M200 0 L200 630 M450 0 L450 630 M700 0 L700 630 M950 0 L950 630"/>
  </g>

  <!-- mark -->
  <g transform="translate(86 86)">
    <rect x="0" y="0" width="180" height="180" rx="42" fill="url(#mark)"/>
    <!-- stylized P glyph -->
    <path d="M48 50v76M48 50h44M48 86h44" stroke="#02180c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 50a18 18 0 0 1 0 36" stroke="#02180c" stroke-width="13" stroke-linecap="round" fill="none"/>
    <circle cx="138" cy="86" r="8.6" fill="#02180c"/>
  </g>

  <!-- wordmark -->
  <text x="86" y="360" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="86" font-weight="800" letter-spacing="-3" fill="#f1f5fb">Pitchverse</text>

  <!-- tagline -->
  <text x="86" y="430" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="500" fill="#a8bcdb">Calibrated football intelligence across the world&apos;s leagues</text>

  <!-- bottom info chips -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(86 520)">
      <rect width="360" height="58" rx="14" fill="#111e36" stroke="#243954"/>
      <circle cx="34" cy="29" r="7" fill="#22c55e"/>
      <text x="58" y="37" fill="#f1f5fb">Calibrated probabilities</text>
    </g>
    <g transform="translate(468 520)">
      <rect width="312" height="58" rx="14" fill="#111e36" stroke="#243954"/>
      <circle cx="34" cy="29" r="7" fill="#22d3ee"/>
      <text x="58" y="37" fill="#f1f5fb">Unified neural model</text>
    </g>
    <g transform="translate(802 520)">
      <rect width="266" height="58" rx="14" fill="#111e36" stroke="#243954"/>
      <circle cx="34" cy="29" r="7" fill="#f59e0b"/>
      <text x="58" y="37" fill="#f1f5fb">Accuracy tracked</text>
    </g>
  </g>
</svg>
