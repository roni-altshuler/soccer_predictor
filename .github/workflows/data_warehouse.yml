name: Data Warehouse Refresh

# Builds the local SQLite match warehouse on a weekly cadence and uploads
# `unified_*_holdout.json` from a smoke training run so accuracy drift is
# visible in the Actions UI. The full ML retrain still runs locally /
# from prediction_pipeline.yml; this job exists to keep the warehouse
# loaders honest (the ETL is slow and breaks silently when a source's
# HTML / CSV layout changes).

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to refresh (comma-separated). Default: --espn --football-data --clubelo'
        required: false
        default: '--espn --football-data --clubelo'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies (without torch)
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch' requirements.txt > /tmp/req-no-torch.txt
          pip install -r /tmp/req-no-torch.txt

      - name: Refresh selected warehouse sources
        run: |
          # Default to the fast, network-resilient sources. The slower
          # scrapers (FBref, Understat, Open-Meteo) can be opted in via
          # workflow_dispatch inputs.
          python -m backend.scripts.build_warehouse \
            ${{ github.event.inputs.sources || '--espn --football-data --clubelo' }} \
            --min-season 2018 \
            --verbose

      - name: Show warehouse stats
        run: python -m backend.scripts.build_warehouse --stats

      - name: Upload warehouse stats
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-stats
          path: |
            backend/data/warehouse.sqlite
            backend/data/cache/
          retention-days: 30
