name: Prediction Pipeline

on:
  schedule:
    # Run 3x daily: 6 AM, 2 PM, 10 PM UTC
    # 6 AM catches overnight results (Asia, late Americas)
    # 2 PM catches afternoon matches (Europe), morning results
    # 10 PM catches evening matches (Europe, Americas)
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write

jobs:
  prediction-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install httpx scipy numpy scikit-learn xgboost lightgbm pydantic pydantic-settings email-validator pyyaml beautifulsoup4

      - name: Install CPU-only PyTorch (unified model engine)
        # If this fails, predict_upcoming falls back to the legacy
        # neural-registry / Dixon-Coles chain — predictions keep flowing.
        continue-on-error: true
        run: pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2.0'

      - name: Download unified model artifacts + warehouse
        # Published weekly by train_unified.yml to the models-latest release.
        # The warehouse (gitignored) feeds the unified model's feature
        # builder. A failed download must never kill the 3x-daily run —
        # predict_upcoming falls back to the legacy engines without them.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download models-latest \
            --dir backend/data/models \
            --pattern 'unified_*' \
            --clobber
          gh release download models-latest --pattern 'warehouse.sqlite.gz' --dir /tmp --clobber
          gunzip -f /tmp/warehouse.sqlite.gz
          mv /tmp/warehouse.sqlite backend/data/warehouse.sqlite
          ls -la backend/data/models/ || true

      - name: Refresh current-season results in warehouse
        # Keeps rolling-form features fresh between weekly warehouse
        # publishes (matters most for daily tournaments like the World Cup).
        continue-on-error: true
        run: |
          if [ -f backend/data/warehouse.sqlite ]; then
            python -m backend.scripts.build_warehouse --espn --current-season
          fi

      - name: Fetch match outcomes
        run: python -m backend.scripts.fetch_outcomes
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Fit per-league goal / home-advantage / draw parameters
        # Must run BEFORE predict_upcoming, which reads league_params.json.
        # Measured from completed matches in the warehouse, not nudged from the
        # last run's error — the nudge loop that used to own this file walked
        # every league onto a clamp (Premier League at avg_goals 0.75,
        # home_adv 0.05) and served it. --strict fails the step if a fitted
        # value lands on a sanity rail, which now means the estimator is wrong.
        # Skipped, not failed, when the warehouse could not be restored.
        run: |
          if [ -f backend/data/warehouse.sqlite ]; then
            python -m backend.scripts.fit_league_params --strict
          else
            echo "No warehouse — leaving league_params.json as committed"
          fi
        working-directory: ${{ github.workspace }}

      - name: Generate new predictions
        run: python -m backend.scripts.predict_upcoming --days 7
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run training feedback
        run: python -m backend.scripts.train_feedback
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only add files that exist and are tracked (models/ is gitignored)
          git add backend/data/predictions/ backend/data/league_params.json || true
          if [ -f backend/data/training_results.json ]; then
            git add backend/data/training_results.json || true
          fi
          
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No prediction data changes to commit"
          else
            OUTCOMES=$(git diff --cached --stat -- 'backend/data/predictions/' | tail -1)
            MSG="chore: update predictions [automated]"
            MSG="$MSG"$'\n\n'"Fetch outcomes, generate predictions, train feedback loop."
            MSG="$MSG"$'\n'"$OUTCOMES"
            git commit -m "$MSG"
            git push
          fi
