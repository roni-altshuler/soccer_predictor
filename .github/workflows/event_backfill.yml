name: Event Backfill

# Maintains the minute-level timeline foundation (VISION_2030 Phase 0) on a
# daily cadence:
#
#   1. restore the gitignored warehouse from the rolling `models-latest`
#      release (the same asset the prediction pipeline and weekly training
#      consume);
#   2. ingest newly finished matches so there are rows to backfill;
#   3. incrementally backfill goal/red-card events — backfill_events only
#      attempts matches missing from `match_event_coverage`, and its
#      integrity guard stores NOTHING unless the events reproduce the final
#      score, so re-runs are cheap and the corpus never degrades;
#   4. regenerate the committed artifacts that Vercel serves (rarity state
#      counts + precedents, justice ledger, event-coverage summary) and the
#      Dixon-Coles baseline params;
#   5. republish the warehouse (the coverage rows written in step 3 ARE the
#      resumability state — without this, every run redoes the same work);
#   6. commit artifacts only when they substantively changed (generated_at
#      timestamp churn alone is not a change).
#
# HONESTY RULE (this repo once lost 3 months to a masked crash): no
# `continue-on-error`, no `|| true`. A broken step must fail the run visibly.

on:
  schedule:
    # Daily 08:30 UTC — after the 06:00 prediction run, and clear of the
    # Sunday train_unified window (02:00-05:00), which also downloads and
    # republishes warehouse.sqlite.gz on the models-latest release.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      since_days:
        description: 'Lookback window in days for the incremental backfill'
        required: false
        default: '30'
      espn_limit:
        description: 'Max matches to attempt from the primary event source'
        required: false
        default: '800'

permissions:
  contents: write

concurrency:
  group: event-backfill
  cancel-in-progress: false

jobs:
  backfill-events:
    runs-on: ubuntu-latest
    # Bounded: the backfill is incremental (a normal day is a few dozen new
    # matches) and hard-capped by --limit; the artifact builders run in
    # seconds. The budget is dominated by the recent-season ingest.
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies (no torch — nothing here infers)
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch' requirements.txt > /tmp/req-no-torch.txt
          pip install -r /tmp/req-no-torch.txt

      - name: Download warehouse from models-latest release
        # Unlike the prediction pipeline there is NO fallback here: the
        # release warehouse carries match_event_coverage — the record of
        # every already-verified timeline. Building from scratch instead
        # would re-attempt the whole history and then commit regressed
        # artifacts. Fail loudly and fix the release asset instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download models-latest --pattern 'warehouse.sqlite.gz' --dir /tmp --clobber
          gunzip -f /tmp/warehouse.sqlite.gz
          mv /tmp/warehouse.sqlite backend/data/warehouse.sqlite
          python -m backend.scripts.build_warehouse --stats

      - name: Restore the published event corpus
        # The warehouse asset has four writers and no merge, so a job that
        # downloaded it before today's backfill and re-uploaded it afterwards
        # silently deletes verified timelines. That happened on 2026-08-09 and
        # cost 3,140 of them. The corpus is therefore ALSO published on its own,
        # and restored here before anything reads coverage. INSERT OR IGNORE, so
        # this only ever adds.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download models-latest --pattern 'match_events.csv.gz' \
            --dir /tmp --clobber || echo "no published event corpus yet"
          python -m backend.scripts.sync_events import \
            --input /tmp/match_events.csv.gz --allow-missing

      - name: Ingest newly finished matches
        # The release copy is up to a week old (train_unified republishes
        # Sundays). Both ESPN universes plus football-data.co.uk, last two
        # season labels — the split-year window straddles the August
        # European season rollover.
        run: |
          YEAR=$(date -u +%Y)
          python -m backend.scripts.build_warehouse \
            --espn --espn-women --football-data \
            --min-season $((YEAR - 1)) --max-season "$YEAR"

      - name: Fold split club identities the ingest just recreated
        # The ingest above reads two sources for the same competition and they
        # do not always resolve to the same club, so the same match can enter
        # twice. On 2026-08-13 that had put 748 rows in a 380-match eng.1
        # season, invisible to every check because the duplicate detector keyed
        # on `phase` — which is what the SOURCE called the round, so two
        # sources describing one match disagreed and never grouped.
        #
        # Run BEFORE the backfill so timelines are fetched against the
        # surviving rows rather than against a row about to be deleted, and
        # before the artifacts are built so nothing is derived from a corpus
        # that counts matches twice. The merge keeps the ESPN row (the one
        # re-ingested tomorrow), coalesces every column the loser had into it,
        # and MOVES the timeline across, so this costs no odds and no coverage.
        #
        # The identity merges run FIRST and are not optional: a duplicate is
        # only visible once both rows point at the same club. football-data
        # spells clubs tersely enough to fall under the resolver's 0.92 fuzzy
        # threshold, so it keeps minting second `teams` rows — ger.1 2025 sat
        # at 340 rows for a 306-match season behind a split Heidenheim, and
        # deduping alone could not see it.
        #
        # `merge-normalised` is here because the hand-curated SPLIT_IDENTITIES
        # list is permanently behind reality: it only knows clubs someone has
        # already been burned by. On 2026-08-25 this job ingested newly
        # promoted Coventry City's first Premier League result under
        # football-data's "Coventry", a spelling no list had ever needed; the
        # hand list missed it, dedupe could not see the duplicate behind the
        # split, and the next morning's season forecast measured eng.1 at 381
        # fixtures in a 380-match season and withdrew the league's table.
        # The structural pass folds exactly what the integrity validator
        # flags (same normalised name, or containment gated on the two never
        # having met + DISTINCT_CLUB_PAIRS), so the next promoted club heals
        # the same day it splits rather than at Sunday's fixpoint repair.
        run: |
          python -m backend.scripts.repair_warehouse \
            --only merge-identities --only merge-normalised \
            --only dedupe-fixtures

      - name: Backfill events — primary source (incremental)
        # Only matches absent from match_event_coverage inside the lookback
        # window are attempted; exit code 1 = polite hard-stop after
        # consecutive 4xx refusals, which must fail the run.
        run: |
          SINCE=$(date -u -d "${{ github.event.inputs.since_days || '30' }} days ago" +%Y-%m-%d)
          python -m backend.scripts.backfill_events --source espn \
            --since "$SINCE" --sleep 0.5 \
            --limit "${{ github.event.inputs.espn_limit || '800' }}"

      - name: Backfill events — secondary source (top-5 league gaps)
        # Covers rows the primary source has no event id for (e.g. the
        # football-data.co.uk fixtures). Season labels flip in August.
        run: |
          SINCE=$(date -u -d "${{ github.event.inputs.since_days || '30' }} days ago" +%Y-%m-%d)
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          if [ "$MONTH" -lt 8 ]; then SEASON=$((YEAR - 1)); else SEASON=$YEAR; fi
          python -m backend.scripts.backfill_events --source understat \
            --season "$SEASON" --since "$SINCE" --sleep 0.5 --limit 400

      - name: Regenerate committed artifacts
        # The pivot (2026-08-08) deleted build_rarity, build_justice,
        # build_match2vec and export_engine_kernel along with the features they
        # fed. This step kept calling them and the job failed every day from
        # then on. What survives is the part that serves the prediction engine.
        run: |
          python -m backend.scripts.build_event_coverage
          python -m backend.scripts.train_dixon_coles
          # Gate Dixon-Coles into the per-league serving policy: it takes over a
          # league only where it clears the always-home floor AND beats the
          # incumbent net (torch-free — pure NumPy, so it runs here). This is
          # what stops a parity league from being served a model that loses to
          # picking the home team.
          python -m backend.scripts.build_statistical_selection
          python -m backend.scripts.build_sim_priors

      - name: Coverage regression guard
        # matches_covered may only grow: the backfill adds coverage rows and
        # never removes them. A drop means this run operated on a warehouse
        # that lost its event history (e.g. the release asset was rebuilt
        # from scratch) — committing would clobber good artifacts with a
        # thin corpus. Fail BEFORE the publish/commit steps.
        #
        # Reads the event-coverage summary directly. It used to read the rarity
        # artifact, which measured the same corpus only as a side effect of
        # being built from it — and which no longer exists.
        run: |
          NEW=$(python -c "import json; print(json.load(open('backend/data/events/coverage.json'))['totals']['covered'])")
          OLD=$(git show HEAD:backend/data/events/coverage.json | python -c "import json,sys; print(json.load(sys.stdin)['totals']['covered'])")
          echo "matches_covered: HEAD=$OLD -> new=$NEW"
          if [ "$NEW" -lt "$OLD" ]; then
            echo "::error::Event corpus regressed ($OLD -> $NEW covered matches). The release warehouse is missing event history — restore a warehouse that contains match_event_coverage before re-running."
            exit 1
          fi

      - name: Warehouse integrity canary (report only)
        # The SAME gate `train_unified` blocks on, run daily against the same
        # warehouse this job is about to publish.
        #
        # Why it exists: that gate runs Sundays. When it broke on 2026-08-16
        # — `season_team_counts` reporting "esp.1 2026: 2 distinct teams,
        # expected 20" the morning after La Liga kicked off — the retrain was
        # lost and the next attempt was seven days away. A weekly gate is a
        # weekly-resolution detector, and warehouse damage arrives daily.
        #
        # Deliberately `continue-on-error`. This is the one place CLAUDE.md's
        # rule against it does not apply: the argument there is that a silent
        # step is indistinguishable from a quiet day, which is true of a step
        # that CAPTURES something. This one captures nothing and decides
        # nothing — `train_unified` still blocks, and the coverage guard above
        # still fails this run on real regression. Making it blocking would
        # add a new way for a daily pipeline to fail, which is the opposite of
        # what it is for.
        continue-on-error: true
        run: |
          set +e
          OUT=$(python -m backend.scripts.validate_warehouse_integrity \
                  --min-season 2005 --leagues wave-a --verbose 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "### Warehouse integrity (canary)"
            echo
            if [ "$CODE" -eq 0 ]; then
              echo "All checks passed. Sunday's retrain gate should be green."
            else
              echo ":warning: **This is what \`train_unified\` will fail on next Sunday.**"
              echo "Fix it before then, or the weekly retrain is lost again."
              echo
              echo '```'
              echo "$OUT" | grep -E '^\[(FAIL|WARN)\]|^ +- ' | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Publish updated warehouse to models-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -c backend/data/warehouse.sqlite > /tmp/warehouse.sqlite.gz
          gh release upload models-latest --clobber /tmp/warehouse.sqlite.gz

          # The corpus outlives the warehouse it happens to be sitting in.
          python -m backend.scripts.sync_events export \
            --output /tmp/match_events.csv.gz
          gh release upload models-latest --clobber /tmp/match_events.csv.gz

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add backend/data/events/ backend/data/dixon_coles_params.json \
                  backend/data/models/model_selection.json \
                  backend/data/sim_priors.json

          # Every builder stamps generated_at; timestamp churn alone is not
          # a change worth a daily commit.
          if git diff --cached --quiet -I'"generated_at":'; then
            echo "No substantive artifact changes — skipping commit"
          else
            STATS=$(git diff --cached --stat | tail -1)
            MSG="chore: event backfill + artifact refresh [automated]"
            MSG="$MSG"$'\n\n'"Incremental timeline backfill; event coverage; Dixon-Coles params, serving policy and simulator priors."
            MSG="$MSG"$'\n'"$STATS"
            git commit -m "$MSG"
            # The 3x-daily prediction bot races this push. --autostash keeps
            # an incidental unstaged file from aborting the rebase.
            git pull --rebase --autostash origin main
            git push
          fi
