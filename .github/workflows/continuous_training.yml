name: Continuous Training

on:
  schedule:
    # Weekly: Sundays at 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Space-separated league keys (e.g. "eng.1 esp.1"). Leave blank for all.'
        required: false
        default: ''
        type: string
      force:
        description: 'Skip the freshness check.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Note on where the promotion gate actually bites: backend/data/models/*
      # is gitignored, so the binaries trained here never leave the runner and
      # the gate's artifact rollback is a no-op on CI. What this job publishes
      # is the *evidence* — the drift report and model_selection.json — plus a
      # pass/fail signal. The rollback matters when the same command is run
      # where the models are served from, which is why it lives in the
      # orchestrator rather than in this workflow.
      - name: Run continuous training orchestrator
        id: orchestrator
        run: |
          set +e
          ARGS="--global-model"
          if [ -n "${{ github.event.inputs.leagues }}" ]; then
            ARGS="$ARGS --leagues ${{ github.event.inputs.leagues }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Running: python -m backend.scripts.continuous_training $ARGS"
          # Tee stdout so we can grep the structured CONTINUOUS_TRAINING_SUMMARY
          # line and distinguish a genuine regression from a crash/error.
          python -m backend.scripts.continuous_training $ARGS 2>&1 | tee /tmp/ct_output.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          SUMMARY=$(grep "^CONTINUOUS_TRAINING_SUMMARY:" /tmp/ct_output.log | tail -1 || true)
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: ${{ github.workspace }}

      - name: Commit updated artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the artifacts the orchestrator produces. Model binaries under
          # backend/data/models/ stay gitignored; the serving policy is the one
          # committed file there (see .gitignore) so it needs no mask.
          git add backend/data/diagnostics/ || true
          git add backend/data/training_results.json || true
          git add backend/data/models/model_selection.json

          if git diff --cached --quiet; then
            echo "No continuous-training artifacts changed"
          else
            STATS=$(git diff --cached --stat | tail -1)
            MSG="chore: continuous training run [automated]"
            MSG="$MSG"$'\n\n'"Weekly retrain + walk-forward evaluation + drift report."
            MSG="$MSG"$'\n'"$STATS"
            git commit -m "$MSG"
            git push
          fi

      # The orchestrator is the single source of truth for pass/fail. It already
      # emits the ::notice:: / ::error:: annotations and the job summary table,
      # so this step only translates its exit code into the job's status.
      #
      # The contract (see backend/scripts/continuous_training.py):
      #   status=ok                   nothing regressed                    -> 0
      #   status=gate_enforced        some held back, some promoted. The
      #                               guardrail worked; production kept the
      #                               previous artifacts for the held-back
      #                               leagues. NOT a build failure          -> 0
      #   status=systemic_regression  every comparable league regressed,
      #                               which means the pipeline is broken    -> 1
      #   status=error                crash, or a rollback that failed      -> 1
      #
      # Previously this step failed the job whenever held_back > 0. That made a
      # working guardrail indistinguishable from a broken build and trained the
      # maintainer to ignore red runs on this workflow.
      - name: Report orchestrator status
        if: always()
        run: |
          RC="${{ steps.orchestrator.outputs.exit_code }}"
          SUMMARY="${{ steps.orchestrator.outputs.summary }}"
          echo "Orchestrator exit code: $RC"
          echo "Orchestrator summary : $SUMMARY"

          if [ -z "$SUMMARY" ]; then
            echo "::error::Continuous training produced no CONTINUOUS_TRAINING_SUMMARY line (exit ${RC:-unknown}). The run died before it could report — check the orchestrator output above."
            exit 1
          fi

          exit "${RC:-1}"
