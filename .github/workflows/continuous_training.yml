name: Continuous Training

on:
  schedule:
    # Weekly: Sundays at 04:00 UTC.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Space-separated league keys (e.g. "eng.1 esp.1"). Leave blank for all.'
        required: false
        default: ''
        type: string
      force:
        description: 'Skip the freshness check.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run continuous training orchestrator
        id: orchestrator
        run: |
          set +e
          ARGS="--global-model"
          if [ -n "${{ github.event.inputs.leagues }}" ]; then
            ARGS="$ARGS --leagues ${{ github.event.inputs.leagues }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Running: python -m backend.scripts.continuous_training $ARGS"
          # Tee stdout so we can grep the structured CONTINUOUS_TRAINING_SUMMARY
          # line and distinguish a genuine regression from a crash/error.
          python -m backend.scripts.continuous_training $ARGS 2>&1 | tee /tmp/ct_output.log
          RC=${PIPESTATUS[0]}
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          SUMMARY=$(grep "^CONTINUOUS_TRAINING_SUMMARY:" /tmp/ct_output.log | tail -1 || true)
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          exit 0
        working-directory: ${{ github.workspace }}

      - name: Commit updated artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the artifacts the orchestrator produces. Model binaries
          # under backend/data/models/ are typically gitignored — try anyway.
          git add backend/data/diagnostics/ || true
          git add backend/data/training_results.json || true
          git add backend/data/models/model_selection.json || true
          git add backend/data/models/ || true

          if git diff --cached --quiet; then
            echo "No continuous-training artifacts changed"
          else
            STATS=$(git diff --cached --stat | tail -1)
            MSG="chore: continuous training run [automated]"
            MSG="$MSG"$'\n\n'"Weekly retrain + walk-forward evaluation + drift report."
            MSG="$MSG"$'\n'"$STATS"
            git commit -m "$MSG"
            git push
          fi

      - name: Fail job with accurate status
        if: always()
        run: |
          RC="${{ steps.orchestrator.outputs.exit_code }}"
          SUMMARY="${{ steps.orchestrator.outputs.summary }}"
          echo "Orchestrator exit code: $RC"
          echo "Orchestrator summary : $SUMMARY"
          if [ "$RC" = "0" ]; then
            exit 0
          fi
          # The orchestrator emits a structured summary line that distinguishes
          # an actual regression (n_reg > 0) from a crash during retrain
          # (e.g. an sklearn API break). Surface the real cause in the
          # warning/error so log readers don't chase a phantom regression.
          if echo "$SUMMARY" | grep -q "status=error"; then
            STAGE=$(echo "$SUMMARY" | grep -oE "stage=[^ ]+" | head -1)
            MSG=$(echo "$SUMMARY" | sed -E 's/.*msg=//' | head -1)
            echo "::error::Continuous training crashed during ${STAGE:-unknown}: ${MSG:-no message}"
          elif echo "$SUMMARY" | grep -q "regressions=[^0]"; then
            echo "::warning::Continuous training detected a model regression — see backend/data/diagnostics/training_drift_*.json."
          else
            echo "::error::Continuous training failed with RC=$RC and no structured summary. Check the orchestrator output above."
          fi
          exit 1
