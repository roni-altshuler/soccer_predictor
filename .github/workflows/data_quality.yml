name: Data Quality

on:
  push:
    paths:
      - 'backend/data/historical/**'
      - 'backend/scripts/validate_data_quality.py'
      - '.github/workflows/data_quality.yml'
  pull_request:
    paths:
      - 'backend/data/historical/**'
      - 'backend/scripts/validate_data_quality.py'
      - '.github/workflows/data_quality.yml'
  workflow_dispatch:

jobs:
  historical-data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate historical coverage
        run: python -m backend.scripts.validate_data_quality
