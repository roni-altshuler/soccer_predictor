name: CI

# Frontend validation for every PR and push to main. Backend tests run in a
# separate workflow (test_backend.yml). Together they gate all changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mirrors local `next lint`. Errors fail the build; the project carries
      # some pre-existing `no-explicit-any` warnings tracked for cleanup in
      # docs/REPOSITORY_AUDIT_2026-06-02.md, so warnings are not yet a hard gate.
      - name: Lint
        run: npx next lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install browser for product contracts
        run: npx playwright install --with-deps chromium

      - name: Responsive product contracts
        id: product
        run: npm run test:product

      - name: Theme navigation journeys
        run: npm run test:theme

      # Preserve the failed production gate. This is one diagnostic replay,
      # using development React to retain its component diff and stack.
      - name: Match evidence hydration failure diagnosis
        if: failure() && steps.product.outcome == 'failure'
        timeout-minutes: 5
        run: npm run test:hydration:evidence

      - name: Evaluation hydration failure diagnosis
        if: failure() && steps.product.outcome == 'failure'
        timeout-minutes: 5
        run: npm run test:hydration

      - name: Upload product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-quality-evidence
          path: |
            /tmp/pitchverse-product-quality/
            /tmp/pitchverse-theme-quality/
            /tmp/pitchverse-evaluation-hydration/
            /tmp/pitchverse-match-evidence-hydration/
          if-no-files-found: ignore
