name: Capture Vendor Predictions

# Buy the challenger's answer before kickoff, then score it against ours.
#
# The comparison this feeds — "if theirs is better, use theirs" — is only
# answerable if both forecasts were fixed BEFORE the match. A number fetched
# afterwards is not a forecast, whoever sold it, so a missed capture cannot be
# recovered: the fixture is simply never scoreable. That is the entire reason
# this runs on a schedule instead of being a command someone remembers.
#
# Cost: the free plan allows 100 requests/day. Each run spends one call listing
# a date plus one per fixture it has not already captured, and capture is
# idempotent on (vendor, fixture_id) — so four runs over two dates cost roughly
# 25 requests a day in total, not 4x25.
#
# The day's quota belongs to the KEY, not to one invocation, and reaching the
# cap is what got the account suspended on 2026-08-28. The script reads the
# vendor's own `x-ratelimit-requests-remaining` header on every response and
# stops capturing at a reserve of 15, whoever spent the rest of the day.
#
# HONESTY RULE (this repo once lost 3 months to a masked crash): no
# `continue-on-error`, no `|| true`. A missing key fails the run, a crash fails
# the run, and a vendor that refuses us is never dressed up as a quiet day —
# the refusal is written to backend/data/diagnostics/vendor_status.json in the
# vendor's own words and committed, so the record says WHY there are no rows.
#
# What a refusal does NOT do is fail the run four times a day for as long as it
# lasts. The account was suspended on 2026-08-28 and thirteen identical red
# runs later the emails were teaching nobody anything. A refusal fails the run
# ONCE, when it is new (or changes reason); every run after that carries a
# warning annotation until the vendor serves us again, at which point the
# record flips back and a notice says so. Nothing needs re-enabling by hand.

on:
  schedule:
    # Every 6 hours. Kickoffs are spread across every time zone we serve, and a
    # once-daily run would arrive after the early ones.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Capture a specific date (YYYY-MM-DD) instead of today + tomorrow'
        required: false

permissions:
  contents: write

concurrency:
  group: capture-vendor-predictions
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install numpy

      # `capture_vendor_predictions.py` treats a missing key as "nothing to do"
      # and exits 0, which is right for a local run and wrong here: a scheduled
      # job that silently captures nothing looks exactly like a quiet day.
      - name: Require the API key
        env:
          API_FOOTBALL: ${{ secrets.API_FOOTBALL }}
        run: |
          if [ -z "$API_FOOTBALL" ]; then
            echo "::error::API_FOOTBALL is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Capture pre-kickoff probabilities
        id: capture
        env:
          API_FOOTBALL: ${{ secrets.API_FOOTBALL }}
          DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            set -- --date "$DATE"
          else
            # Tomorrow as well as today: a fixture kicking off at 00:30 UTC is
            # already unreachable by the time the 02:00 run lists "today".
            set -- --days 2
          fi
          # 75 is the script's "the vendor refused us": already recorded in
          # vendor_status.json and annotated, with `vendor_refused=new|known`
          # in this step's outputs. Whether that fails the run is decided in
          # the last step, once the record is committed. Any other non-zero
          # exit is a crash and fails right here.
          set +e
          python -m backend.scripts.capture_vendor_predictions "$@"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 75 ]; then
            exit "$rc"
          fi

      # Scores whatever has settled since the last run. Prints the verdict
      # under the pre-registered rule, which will read "keep ours" until the
      # sample is large enough to say anything else.
      - name: Score the vendor against us
        run: python -m backend.scripts.score_vendor_predictions

      - name: Commit the capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/predictions/vendor_predictions.jsonl \
                  backend/data/diagnostics/vendor_vs_ours.json \
                  backend/data/diagnostics/vendor_status.json
          if git diff --cached --quiet; then
            echo "nothing to commit (no new forecasts, vendor state unchanged)"
            exit 0
          fi
          n=$(git diff --cached --numstat -- backend/data/predictions/vendor_predictions.jsonl \
              | awk '{s+=$1} END {print s+0}')
          if [ "$n" -gt 0 ]; then
            git commit -m "chore: capture ${n} vendor forecasts [automated]"
          else
            git commit -m "chore: record the vendor's state [automated]"
          fi
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # One email per outage, not one per run. The refusal is on record and
      # annotated above; this is the one run that gets to be red for it.
      - name: Fail once, when the refusal is new
        if: steps.capture.outputs.vendor_refused == 'new'
        run: |
          echo "::error::api-football has started refusing the capture. Details are in backend/data/diagnostics/vendor_status.json; the fix is at https://dashboard.api-football.com. Later runs will warn, not fail, until it serves us again."
          exit 1
