name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please keep proposals aligned with Pitchverse's
        educational/research intent — no betting features.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits and when?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like. Sketches/mockups welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Next.js / UI)
        - Backend (FastAPI / API routes)
        - ML / predictions / accuracy
        - Data ingestion / pipeline
        - Docs / developer experience
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This does not introduce betting features or betting advice
          required: true
