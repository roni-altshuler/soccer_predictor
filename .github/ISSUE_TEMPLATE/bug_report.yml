name: Bug report
description: Report something that isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search existing issues first to avoid duplicates.
        For security issues, **do not** file here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include the route/page and any inputs (teams, league, gender).
      placeholder: |
        1. Go to /predict
        2. Select Arsenal vs Chelsea
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Next.js / UI)
        - Backend (FastAPI / API routes)
        - ML / predictions / accuracy
        - Data ingestion / pipeline
        - Marketing landing (/welcome)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser + OS, or deployment (local / Vercel), and any relevant versions.
      placeholder: "Chrome 124 on macOS 14 / local dev"
  - type: textarea
    id: logs
    attributes:
      label: Console / server logs
      description: Paste relevant errors. Redact any secrets.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
