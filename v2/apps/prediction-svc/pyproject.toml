[project]
name = "prediction-svc"
version = "0.1.0"
description = "FotPredict v2 prediction service: features -> Triton -> calibrator -> MatchPrediction."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
    "tritonclient[http]>=2.46",
    "fotpredict-core",
    "fotpredict-ml",
    "fotpredict-observability",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction"]
