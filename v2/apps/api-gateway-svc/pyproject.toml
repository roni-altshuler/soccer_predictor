[project]
name = "api-gateway-svc"
version = "0.1.0"
description = "FotPredict v2 BFF gateway (FastAPI). Public REST entry point; composes prediction/simulation/realtime services."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "redis>=5.0",
    "fotpredict-core",
    "fotpredict-clients",
    "fotpredict-observability",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
