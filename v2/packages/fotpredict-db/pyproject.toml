[project]
name = "fotpredict-db"
version = "0.1.0"
description = "SQLAlchemy 2.x models + Alembic migrations for FotPredict v2"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pglast>=7.0", "pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fotpredict_db"]
